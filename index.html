<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #d33833;
            color: white;
            padding: 25px;
        }

        .container {
            margin: 80px auto;
            background: white;
            padding: 40px;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        h1 {
            color: #d33833;
        }

        .success {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Jenkins CI/CD Pipeline</h1>
    </header>

    <div class="container">
        <h1>Hello from Jenkins!</h1>

        <p class="success">
            Build and Deployment Successful
        </p>

        <p>
            This website is deployed automatically using a Jenkins Pipeline.
        </p>

        <p>
            <strong>Technologies:</strong><br>
            Jenkins | Git | GitHub | Linux | AWS
        </p>
    </div>

    <footer>
        <p>DevOps Project | Jenkins CI/CD</p>
    </footer>

</body>
</html>
